name: Build Executável Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Compilar com PyInstaller
      run: |
        pyinstaller --noconsole --onefile --hidden-import win32timezone conversor.py

    - name: Fazer Upload do Executável
      uses: actions/upload-artifact@v4
      with:
        name: Conversor-Mapfre-EXE
        path: dist/conversor.exe
